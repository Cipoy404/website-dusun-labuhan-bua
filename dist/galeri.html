<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Galeri — Dusun Labuhan Bua</title>
    <meta
      name="description"
      content="Galeri kehidupan, pesisir, budaya, dan kegiatan Dusun Labuhan Bua."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />

  </head>
  <body data-page="galeri">
    <header class="site-header inner-header" data-header></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <div class="breadcrumb">
            <a href="index.html">Beranda</a><span>/</span><span>Galeri</span>

      <div class="notice-bar">

        </div>
      </div>

        <img alt="" />
